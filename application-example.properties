# Copy this file to src/main/resources/application.properties and fill in real values.
# Do NOT commit secrets. Keep this example in Git for onboarding.

# -----------------------------
# Server
# -----------------------------
server.port=8080

# -----------------------------
# Database (PostgresSQL)
# -----------------------------
spring.datasource.url=jdbc:postgresql://HOST:PORT/DB_NAME?sslmode=require
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD

# -----------------------------
# JPA / Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -----------------------------
# Mailjet (Email)
# -----------------------------
mailjet.apiKey=YOUR_MAILJET_API_KEY
mailjet.apiSecret=YOUR_MAILJET_API_SECRET
mailjet.fromEmail=no-reply@example.com
mailjet.fromName=TopperFriend

# -----------------------------
# JWT
# -----------------------------
app.jwt.secret=CHANGE_ME_SUPER_SECRET
app.jwt.expiration-ms=86400000
app.jwt.clock-skew-seconds=30

# -----------------------------
# Gemini (Google Generative Language API)
# -----------------------------
gemini.apiKey=YOUR_GEMINI_API_KEY

# -----------------------------
# Google OAuth
# -----------------------------
google.oauth.client-id=YOUR_GOOGLE_CLIENT_ID
google.oauth.client-secret=YOUR_GOOGLE_CLIENT_SECRET
google.oauth.redirect-uri=http://localhost:3000/auth/google/callback

# -----------------------------
# CORS (comma-separated origins)
# -----------------------------
app.cors.allowed-origins=http://localhost:3000

# -----------------------------
# Resilience4j Circuit Breaker (Gemini)
# -----------------------------
resilience4j.circuitbreaker.instances.gemini.register-health-indicator=true
resilience4j.circuitbreaker.instances.gemini.sliding-window-size=20
resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gemini.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s
